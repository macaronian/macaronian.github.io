<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUJI</title>
<link href="" rel="shortcut icon">
<link href="https://fonts.googleapis.com/css?family=M+PLUS+1p:400,500" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<style>
.swiper {
  /*margin: 0 auto;*/
  width: 100%;
  background: url(images/bg.jpg) no-repeat;
}
img {
  width: 100%;
}
.toolbar {
  overflow: hidden;
  text-align: center;
}
.nav {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px 0;
}
#prev {
  margin-right: 0.5rem;
  width: 16px;
  height: 16px;
  background: url(images/arrow-left.svg) no-repeat;
}
#next {
  margin-left: 0.5rem;
  width: 16px;
  height: 16px;
  background: url(images/arrow-right.svg) no-repeat;
}
.swiper-pagination-bullet {
  background: #ccc !important;
  opacity: 0.8 !important;
}
.swiper-pagination-bullet-active {
  background: #fff !important;
  opacity: 1 !important;
}
</style>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
/>
<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
</head>
<body>
<header>
<div class="container">
<h1>MUJI Lab.</h1>
<h2></h2>
</div><!-- /.container -->
</header>
<main>
<div class="container">
<section>
  <div class="swiper">
    <div id="chimpo" class="swiper-wrapper">
      <div class="swiper-slide"><img src="images/image1.jpg"></div>
      <div class="swiper-slide"><img src="images/image2.jpg"></div>
      <div class="swiper-slide"><img src="images/image3.jpg"></div>
      <div class="swiper-slide"><img src="images/image4.jpg"></div>
      <div class="swiper-slide"><img src="images/image5.jpg"></div>
    </div>
    <div class="toolbar">
      <div class="nav">
        <div id="prev" class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
        <div id="next" class="swiper-button-next"></div>
      </div>
    </div>
  </div>
</section>
</div><!-- /.container -->
</main>
<footer>
<div class="container">
<p>MUJI</p>
</div><!-- /.container -->
</footer>
